<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1140" width="1000" height="1140">
<!-- Styling -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
  </marker>
  <marker id="arrow-dotted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
  </marker>
  <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.07"/>
  </filter>
</defs>
<style>
  text { font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  .title { font-weight: bold; font-size: 12.5px; fill: #0F172A; text-anchor: middle; }
  .subtitle { font-size: 10.5px; fill: #334155; text-anchor: middle; }
  .italic { font-style: italic; font-size: 9.3px; fill: #334155; text-anchor: middle; }
  
  /* Models Note Styling (Warm Amber) */
  .note-models-title { font-weight: bold; font-size: 11px; fill: #713F12; text-anchor: start; }
  .note-models-text { font-size: 9.5px; fill: #713F12; text-anchor: start; }
  .note-models-italic { font-style: italic; font-size: 8.8px; fill: #854D0E; }
  
  /* Augmentation Note Styling (Soft Blue) */
  .note-aug-title { font-weight: bold; font-size: 11px; fill: #1D4ED8; text-anchor: start; }
  .note-aug-text { font-size: 9.5px; fill: #1E3A8A; text-anchor: start; }
  .note-aug-italic { font-style: italic; font-size: 8.8px; fill: #2563EB; }

  /* Metrics Note Styling (Soft Teal/Cyan) */
  .note-metrics-title { font-weight: bold; font-size: 11px; fill: #0F766E; text-anchor: start; }
  .note-metrics-text { font-size: 9.5px; fill: #134E4A; text-anchor: start; }

  .edge-label { font-size: 9px; fill: #1E293B; text-anchor: middle; font-weight: 500; }
  .edge-label-bold { font-weight: bold; font-size: 10.5px; fill: #0F172A; text-anchor: middle; }
</style>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- ========================================== -->
<!-- STAGE 1: Data Loading -->
<!-- ========================================== -->
<rect x="350" y="24" width="280" height="74" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="490" y="47" class="title">Data Loading</text>
<text x="490" y="67" class="subtitle">Wood Surface Defects Dataset</text>
<text x="490" y="85" class="italic">(4,000 images, 8 defect classes)</text>

<!-- Connection: Stage 1 -> Stage 2 -->
<path d="M 490 98 L 490 128" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- ========================================== -->
<!-- STAGE 2: Preprocessing -->
<!-- ========================================== -->
<rect x="80" y="128" width="820" height="110" rx="8" fill="#FAFAFA" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="490" y="147" class="title" style="font-size: 11.5px;">Preprocessing</text>

<!-- Preprocessing Step 1 -->
<rect x="98" y="158" width="225" height="66" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3" filter="url(#shadow)"/>
<text x="210.5" y="185" class="title" style="font-size: 10.5px;">Black Border Cropping</text>
<text x="210.5" y="205" class="italic" style="font-size: 9.0px;">(Otsu Threshold &amp; Morph. Closing)</text>

<!-- Step 1 -> Step 2 -->
<path d="M 323 191 L 375 191" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- Preprocessing Step 2 -->
<rect x="375" y="158" width="225" height="66" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3" filter="url(#shadow)"/>
<text x="487.5" y="185" class="title" style="font-size: 10.5px;">Resolution Downscaling</text>
<text x="487.5" y="205" class="italic" style="font-size: 9.0px;">(0.5x Area Interpolation)</text>

<!-- Step 2 -> Step 3 -->
<path d="M 600 191 L 652 191" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- Preprocessing Step 3 -->
<rect x="652" y="158" width="232" height="66" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3" filter="url(#shadow)"/>
<text x="768" y="182" class="title" style="font-size: 10.0px;">Coordinate Transform &amp; Size Gate</text>
<text x="768" y="199" class="italic" style="font-size: 9.0px;">(Preserve thin defects:</text>
<text x="768" y="213" class="italic" style="font-size: 9.0px;">min 2px / 12px²)</text>

<!-- Connection: Stage 2 -> Stage 3 -->
<path d="M 490 238 L 490 268" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- ========================================== -->
<!-- STAGE 3: Data Splitting -->
<!-- ========================================== -->
<rect x="350" y="268" width="280" height="76" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="490" y="291" class="title">Data Splitting</text>
<text x="490" y="311" class="subtitle">Iterative Stratification</text>
<text x="490" y="329" class="italic">(80% Train / 10% Val / 10% Test)</text>

<!-- ========================================== -->
<!-- FLOW LINES FROM DATA SPLITTING -->
<!-- ========================================== -->
<!-- 1. 80% straight down to Majority Plank Balancing -->
<path d="M 490 344 L 490 384" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<rect x="473" y="352" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.9"/>
<text x="490" y="365" class="edge-label-bold">80%</text>

<!-- 2. 10% to Training (Validation split during training) -->
<path d="M 350 310 C 275 310, 275 365, 275 420 L 275 560 C 275 610, 385 595, 385 635" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<rect x="258" y="445" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.9"/>
<text x="275" y="458" class="edge-label-bold">10%</text>

<!-- 3. 10% to Validation (Holdout test evaluation split) -->
<path d="M 630 310 C 780 310, 955 340, 955 400 L 955 775 C 955 805, 680 805, 630 805" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<rect x="938" y="420" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.9"/>
<text x="955" y="433" class="edge-label-bold">10%</text>

<!-- ========================================== -->
<!-- STAGE 4A: Majority Plank Balancing -->
<!-- ========================================== -->
<rect x="350" y="384" width="280" height="68" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.6" filter="url(#shadow)"/>
<text x="490" y="412" class="title" style="font-size: 11.5px;">Majority Plank Balancing</text>
<text x="490" y="433" class="italic" style="font-size: 9.3px;">(Drop 35% majority-only planks)</text>

<!-- Line: Majority Plank Balancing -> Data Augmentation -->
<path d="M 490 452 L 490 492" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- ========================================== -->
<!-- STAGE 4B: Data Augmentation -->
<!-- ========================================== -->
<rect x="350" y="492" width="280" height="70" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.6" filter="url(#shadow)"/>
<text x="490" y="516" class="title">Data Augmentation</text>
<text x="490" y="534" class="subtitle" style="font-size: 10px;">Minority Defect Synthesis</text>
<text x="490" y="550" class="italic" style="font-size: 9.0px;">(Target minority ratio: 33%)</text>

<!-- Anchor line from Data Augmentation to Augmentation Comment (To the right) -->
<path d="M 630 527 L 660 527" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>

<!-- ========================================== -->
<!-- COMMENT CONTAINER: Augmentation Strategies (Beside/Right of Data Augmentation) -->
<!-- ========================================== -->
<g filter="url(#shadow)">
  <path d="M 660 482 A 6 6 0 0 1 666 476 L 914 476 L 922 484 L 922 570 A 6 6 0 0 1 916 576 L 666 576 A 6 6 0 0 1 660 570 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <path d="M 914 476 L 914 484 L 922 484 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.2"/>
</g>
<text x="670" y="495" class="note-aug-title">Augmentation Strategies:</text>
<text x="670" y="514" class="note-aug-text">• <tspan font-weight="bold">Base</tspan> <tspan class="note-aug-italic">(Baseline / No Aug)</tspan></text>
<text x="670" y="531" class="note-aug-text">• <tspan font-weight="bold">Albumentations</tspan> <tspan class="note-aug-italic">(Photometric)</tspan></text>
<text x="670" y="548" class="note-aug-text">• <tspan font-weight="bold">BoxAug Standard</tspan> <tspan class="note-aug-italic">(Cut &amp; Paste)</tspan></text>
<text x="670" y="565" class="note-aug-text">• <tspan font-weight="bold">BoxAug LibCom</tspan> <tspan class="note-aug-italic">(Neural Harmonization)</tspan></text>

<!-- Dotted connection from Augmentation Comment into Training Box -->
<path d="M 750 576 C 750 615, 670 635, 630 655" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-dotted)"/>

<!-- Normal connection from Data Augmentation to Training -->
<path d="M 490 562 L 490 635" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- ========================================== -->
<!-- NOTE: Models Used (Left of Training) -->
<!-- ========================================== -->
<g filter="url(#shadow)">
  <path d="M 45 628 A 6 6 0 0 1 51 622 L 272 622 L 280 630 L 280 714 A 6 6 0 0 1 274 720 L 51 720 A 6 6 0 0 1 45 714 Z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
  <path d="M 272 622 L 272 630 L 280 630 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="1.2"/>
</g>
<text x="55" y="639" class="note-models-title">Models Used:</text>
<text x="55" y="658" class="note-models-text">• <tspan font-weight="bold">Cascade R-CNN</tspan></text>
<text x="65" y="672" class="note-models-italic">(Two-Stage, ResNet-50 + FPN)</text>
<text x="55" y="689" class="note-models-text">• <tspan font-weight="bold">YOLO26m</tspan> <tspan class="note-models-italic">(One-Stage, Anchor-Free Dual-Head)</tspan></text>
<text x="55" y="706" class="note-models-text">• <tspan font-weight="bold">RF-DETR-m</tspan> <tspan class="note-models-italic">(Transformer, NAS)</tspan></text>

<!-- Dashed anchor from Models Used to Training -->
<path d="M 280 677 L 350 677" stroke="#CA8A04" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>

<!-- ========================================== -->
<!-- STAGE 5: Training -->
<!-- ========================================== -->
<rect x="350" y="635" width="280" height="84" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="490" y="660" class="title">Training</text>
<text x="490" y="681" class="subtitle">Multi-Paradigm Model Training</text>
<text x="490" y="701" class="italic" style="font-size: 9.0px;">(Effective-Number Class Weighting)</text>

<!-- Connection: Training -> Validation -->
<path d="M 490 719 L 490 765" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- ========================================== -->
<!-- NOTE: Models Evaluated (Left of Validation) -->
<!-- ========================================== -->
<g filter="url(#shadow)">
  <path d="M 80 764 A 6 6 0 0 1 86 758 L 272 758 L 280 766 L 280 839 A 6 6 0 0 1 274 845 L 86 845 A 6 6 0 0 1 80 839 Z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
  <path d="M 272 758 L 272 766 L 280 766 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="1.2"/>
</g>
<text x="90" y="775" class="note-models-title">Models Evaluated:</text>
<text x="90" y="794" class="note-models-text">• <tspan font-weight="bold">RF-DETR-m</tspan> <tspan class="note-models-italic">(conf = 0.20)</tspan></text>
<text x="90" y="813" class="note-models-text">• <tspan font-weight="bold">YOLO26m</tspan> <tspan class="note-models-italic">(conf = 0.30)</tspan></text>
<text x="90" y="832" class="note-models-text">• <tspan font-weight="bold">Cascade R-CNN</tspan> <tspan class="note-models-italic">(conf = 0.50)</tspan></text>

<!-- Dashed anchor from Models Evaluated to Validation -->
<path d="M 280 805 L 350 805" stroke="#CA8A04" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>

<!-- ========================================== -->
<!-- STAGE 6: Validation -->
<!-- ========================================== -->
<rect x="350" y="765" width="280" height="80" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="490" y="790" class="title">Validation</text>
<text x="490" y="810" class="subtitle">Operating-Point Evaluation</text>
<text x="490" y="828" class="italic">(Confidence Calibration)</text>

<!-- Connection: Validation -> Analysis -->
<path d="M 490 845 L 490 895" stroke="#1E293B" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

<!-- ========================================== -->
<!-- STAGE 7: Analysis -->
<!-- ========================================== -->
<rect x="350" y="895" width="280" height="82" rx="8" fill="#DCFCE7" stroke="#1E293B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="490" y="920" class="title">Analysis</text>
<text x="490" y="940" class="subtitle">Performance Matrices &amp; Figures</text>
<text x="490" y="958" class="italic" style="font-size: 8.8px;">(Bonferroni CIs &amp;</text>
<text x="490" y="970" class="italic" style="font-size: 8.8px;">Statistical Tests)</text>

<!-- Connection: Analysis -> Metrics Note -->
<path d="M 490 977 L 490 1010" stroke="#0D9488" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>

<!-- ========================================== -->
<!-- NOTE: Metrics Used (Bottom of Analysis - Distinct Teal Color) -->
<!-- ========================================== -->
<g filter="url(#shadow)">
  <path d="M 350 1016 A 6 6 0 0 1 356 1010 L 622 1010 L 630 1018 L 630 1104 A 6 6 0 0 1 624 1110 L 356 1110 A 6 6 0 0 1 350 1104 Z" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.2"/>
  <path d="M 622 1010 L 622 1018 L 630 1018 Z" fill="#99F6E4" stroke="#0D9488" stroke-width="1.2"/>
</g>
<text x="365" y="1028" class="note-metrics-title">Metrics Used:</text>
<text x="365" y="1046" class="note-metrics-text">• mAP@0.5 &amp; mAP@0.5:0.95</text>
<text x="365" y="1063" class="note-metrics-text">• Precision, Recall, F1-Score</text>
<text x="365" y="1080" class="note-metrics-text">• Per-Class AP@0.5 (Wilson CIs)</text>
<text x="365" y="1097" class="note-metrics-text">• Calibration Threshold Sweep</text>

</svg>
