[project]
name = "final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=1.4.0",
    "chumpy>=0.70",
    "clip>=0.2.0",
    "diffusers==0.34.0",
    "einops>=0.8.2",
    "huggingface-hub>=0.36.2",
    "imageio>=2.37.4",
    "kagglehub>=1.0.2",
    "libcom",
    "lpips==0.1.4",
    "matplotlib>=3.9.0",
    "mmdet==3.2.0",
    "mmengine>=0.10.7",
    "mmpose==1.2.0",
    "modelscope>=1.38.1",
    "omegaconf>=2.3.1",
    "open-clip-torch>=3.3.0",
    "opencv-python>=5.0.0.93",
    "opencv-python-headless>=5.0.0.93",
    "peft>=0.19.1",
    "polars>=1.43.0",
    "protobuf>=7.35.1",
    "pycocotools>=2.0.7",
    "pydantic==2.6.1",
    "pydantic-settings>=2.2.0",
    "pytorch-lightning>=2.6.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.0",
    "segment-anything>=1.0",
    "sentencepiece>=0.2.2",
    "structlog>=24.1.0",
    "taming-transformers-rom1504>=0.0.6",
    "tabulate>=0.9.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.69.0",
    "transformers==4.44.2",
    "ultralytics>=8.2.0",
    "xformers>=0.0.29.post3",
    "rfdetr==1.3.0",
]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
xtcocotools = ["numpy"]

[tool.uv.workspace]
members = [
    "deps/libcom",
]

[tool.uv.sources]
libcom = { workspace = true, editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["deps/libcom"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.69.0.20260720",
]
